services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: ipmprs
      POSTGRES_USER: ipmprs
      POSTGRES_PASSWORD: ipmprs
    ports: ["5432:5432"]
    volumes: [postgres_data:/var/lib/postgresql/data]
  api:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://ipmprs:ipmprs@db:5432/ipmprs
      SECRET_KEY: change-this-in-production
      CORS_ORIGINS: http://localhost:5173
    ports: ["8000:8000"]
    depends_on: [db]
  web:
    build: ./frontend
    ports: ["5173:80"]
    depends_on: [api]
volumes:
  postgres_data:
